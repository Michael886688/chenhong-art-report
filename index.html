<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self' blob:; img-src https: data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>陈洪画店报告 · 密码阅读</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#233c34;background:#f4f2eb}*{box-sizing:border-box}body{margin:0}body.unlocked{overflow:hidden}[hidden]{display:none!important}#gate{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:420px;background:#fff;border:1px solid #dbe2d8;border-radius:18px;padding:36px;box-shadow:0 16px 55px #20372d09}.eyebrow{font-size:13px;letter-spacing:2px;color:#557564;margin:0 0 14px}h1{font-size:28px;line-height:1.4;margin:0 0 12px}p{font-size:15px;line-height:1.7;color:#657268}label{display:block;font-size:14px;margin:25px 0 8px;font-weight:600}input{width:100%;font:inherit;font-size:20px;padding:13px 14px;border:1px solid #becdc1;border-radius:9px;letter-spacing:3px;outline-offset:3px}button{font:inherit;border:0;border-radius:9px;padding:13px 19px;cursor:pointer;color:#fff;background:#306b50}button:hover{background:#24553f}button:focus-visible{outline:3px solid #d2ac65;outline-offset:3px}button:disabled{opacity:.65;cursor:wait}#unlock-button{width:100%;margin-top:16px}#status{min-height:24px;color:#93502d;font-size:14px;margin:12px 0 0}.hint{font-size:12px;margin:13px 0 0;color:#738177}#view{height:100vh;height:100dvh;display:flex;flex-direction:column}.toolbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid #dbe2d8;font-size:14px}.toolbar button{padding:7px 12px;font-size:13px}iframe{width:100%;flex:1;border:0;background:#f4f2eb;min-height:0}@media(max-width:500px){.card{padding:28px 23px}h1{font-size:25px}.toolbar{padding:0 12px}}
</style></head><body>
<main id="gate"><section class="card" aria-labelledby="title"><p class="eyebrow">陈洪原创画店</p><h1 id="title">请输入密码阅读报告</h1><p>此报告已设置阅读密码。请输入分享人提供的密码。</p><form id="unlock-form" autocomplete="off"><label for="password">阅读密码</label><input id="password" type="password" autocomplete="off" spellcheck="false" aria-describedby="status" required><button id="unlock-button" type="submit">打开报告</button><p id="status" role="status" aria-live="polite"></p></form><p class="hint">本页面不保存密码，刷新后需重新输入。</p><noscript><p>请启用浏览器的 JavaScript 后输入密码。</p></noscript></section></main>
<section id="view" hidden><header class="toolbar"><span>陈洪画店报告</span><button id="lock-button" type="button">重新锁定</button></header><iframe id="reader" title="陈洪原创画店研究报告" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads" referrerpolicy="no-referrer"></iframe></section>
<script type="module" src="./app.mjs"></script></body></html>
